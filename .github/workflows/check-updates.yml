name: Check Runtime Updates & EOL Lifecycle

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-lifecycle:
    name: Audit Runtime Versions & Open Review PR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run lifecycle audit (dry-run)
        run: python3 -m generator update --dry-run > docs/lifecycle-report.json
      - name: Create Draft PR if lifecycle report changed (never auto-merges to production)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/runtime-lifecycle-check
          title: "chore(versions): weekly runtime lifecycle & EOL audit"
          body: |
            Automated weekly runtime version & EOL check generated by `vnh-egg update`.
            **Production Gate:** This PR is opened as a **Draft** and must pass `validate.yml`, `security-scan.yml`, and human review before merging.
          draft: true
          commit-message: "chore(versions): update runtime lifecycle report"
