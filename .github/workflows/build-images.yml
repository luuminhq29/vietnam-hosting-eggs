name: Build & Publish Multi-Arch Docker Images (GHCR)

on:
  workflow_dispatch:
    inputs:
      image_filter:
        description: "Filter by exact tag/id or prefix (e.g. ubuntu_24.04, linux-, base-, empty=all)"
        required: false
        default: ""
      platforms_override:
        description: "Optional platform override (e.g. linux/amd64 for fast build; empty uses versions.json multi-arch)"
        required: false
        default: ""
      publish_ghcr:
        description: "Explicit admin approval to push images to GHCR (false = build-only dry check)"
        type: boolean
        required: true
        default: false
      rollback_tag:
        description: "Optional image tag to roll back (e.g. python_3.13)"
        required: false
        default: ""
      rollback_digest:
        description: "Verified previous sha256 digest for rollback (requires publish_ghcr=true)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  plan-matrix:
    name: Plan Build Matrix from versions.json
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open("versions.json", encoding="utf-8"))
          flt = os.environ.get("IMAGE_FILTER", "").strip()
          plat_ov = os.environ.get("PLATFORMS_OVERRIDE", "").strip()
          items = data["docker_images"]
          if flt:
              tokens = [t.strip() for t in flt.split(",") if t.strip()]
              items = [
                  i for i in items
                  if any(i["id"] == t or i["tag"] == t or i["id"].startswith(t) or i["tag"].startswith(t) for t in tokens)
              ]
          matrix = [
              {
                  "id": i["id"],
                  "tag": i["tag"],
                  "dockerfile": i["dockerfile"],
                  "platforms": plat_ov or ",".join(f"linux/{a}" for a in i.get("architectures", ["amd64"])),
              }
              for i in items
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'include': matrix})}\n")
          PY
        env:
          IMAGE_FILTER: ${{ inputs.image_filter }}
          PLATFORMS_OVERRIDE: ${{ inputs.platforms_override }}

  build-images:
    name: Build ${{ matrix.tag }}
    needs: plan-matrix
    if: ${{ inputs.rollback_tag == '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: ${{ inputs.publish_ghcr == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ inputs.publish_ghcr == true || startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/luuminhq29/yolks:${{ matrix.tag }}
            ghcr.io/luuminhq29/yolks:${{ matrix.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Vietnam Hosting Universal Pterodactyl Docker Image (${{ matrix.tag }})
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  rollback-image:
    name: Rollback GHCR Tag to Verified Digest
    if: ${{ inputs.rollback_tag != '' && inputs.rollback_digest != '' && inputs.publish_ghcr == true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute verified rollback
        run: |
          bash scripts/rollback-image.sh "${{ inputs.rollback_tag }}" "${{ inputs.rollback_digest }}" --confirm-rollback
